<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Informasi Pelaporan Kokurikuler - SMA Darul Ulum Kepohbaru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      main { padding: 0 !important; margin: 0 !important; }
    }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div id="toast-root" class="no-print fixed bottom-5 right-5 z-50 space-y-2 max-w-sm"></div>
  <div id="modal-root" class="no-print"></div>
  <div id="app-root"></div>

  <script>
    const TOKEN_KEY = 'sipk_gas_token_2026';

    const ROLE_LABELS = {
      SUPER_ADMIN: 'Super Admin',
      KEPALA_SEKOLAH: 'Kepala Sekolah',
      KETUA_PELAKSANA: 'Ketua Pelaksana',
      GURU_PENDAMPING: 'Guru Pendamping',
      SISWA: 'Siswa'
    };

    const DOC_CATEGORIES = [
      'Persiapan keberangkatan',
      'Perjalanan',
      'Kunjungan Makam Bung Karno',
      'Kunjungan Museum Bung Karno',
      'Kegiatan edukasi',
      'Diskusi dan refleksi',
      'Foto bersama',
      'Penutupan kegiatan'
    ];

    const ARCHIVE_CATEGORIES = [
      'Surat Izin Kegiatan',
      'Surat Tugas',
      'Proposal',
      'Rencana Anggaran Biaya',
      'Daftar Hadir',
      'Surat Pemberitahuan Orang Tua',
      'Laporan Kegiatan',
      'Dokumentasi'
    ];

    const LKPD_SUBJECTS = [
      {
        id: 'sejarah', title: 'Sejarah',
        q1Key: 'sejarah1', q1Label: 'Tuliskan lima peristiwa penting dalam kehidupan Ir. Soekarno yang kamu temukan di museum beserta tahunnya.',
        q2Key: 'sejarah2', q2Label: 'Pilih satu koleksi yang paling menarik dan jelaskan maknanya bagi perjuangan bangsa.'
      },
      {
        id: 'pkn', title: 'PKn',
        q1Key: 'pkn1', q1Label: 'Pilih satu sila Pancasila dan jelaskan keterkaitannya dengan gagasan Ir. Soekarno.',
        q2Key: 'pkn2', q2Label: 'Sebutkan dua contoh penerapan nilai tersebut dalam kehidupan remaja masa kini.'
      },
      {
        id: 'bahasa', title: 'Bahasa Indonesia',
        q1Key: 'bahasa1', q1Label: 'Catat satu kutipan atau pesan Ir. Soekarno yang paling berkesan, lalu jelaskan dengan kata-katamu sendiri.',
        q2Key: 'bahasa2', q2Label: 'Tulis kerangka teks eksposisi tentang Pentingnya Meneladani Pahlawan Bangsa (tesis, argumen, penegasan ulang).'
      },
      {
        id: 'ekonomi', title: 'Ekonomi',
        q1Key: 'ekonomi1', q1Label: 'Wawancarai minimal dua pedagang: jenis dagangan, asal barang, omzet kasar per hari, dan dampak kunjungan wisatawan.',
        q2Key: 'ekonomi2', q2Label: 'Identifikasi satu peluang usaha baru di kawasan tersebut dan alasannya.'
      },
      {
        id: 'pai', title: 'PAI',
        q1Key: 'pai1', q1Label: 'Tuliskan adab ziarah kubur yang kamu praktikkan dan doa yang dipanjatkan.',
        q2Key: 'pai2', q2Label: 'Nilai akhlak apa yang kamu pelajari dari perjuangan Ir. Soekarno dan para pahlawan?'
      },
      {
        id: 'geografi', title: 'Geografi',
        q1Key: 'geografi1', q1Label: 'Catat tiga jenis bentang alam atau tata guna lahan yang kamu amati di sepanjang perjalanan.',
        q2Key: 'geografi2', q2Label: 'Jelaskan bagaimana kondisi geografis kawasan Blitar mendukung atau memengaruhi aktivitas wisata.'
      }
    ];

    const state = {
      token: localStorage.getItem(TOKEN_KEY) || '',
      user: null,
      previewRole: null,
      data: null,
      activeMenu: 'dashboard',
      subTab: '',
      viewportMode: 'desktop',
      mobileDrawer: false,
      loading: true,
      authError: '',
      studentSearch: '',
      studentClassFilter: 'ALL',
      docCategoryFilter: 'ALL',
      selectedReportId: '',
      reportEditMode: false,
      chartInstance: null
    };

    function gasCall(fnName, ...args) {
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('Lingkungan Google Apps Script tidak terdeteksi. Jalankan melalui URL deployment Web App Apps Script.'));
          return;
        }
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((err) => reject(new Error(err && err.message ? err.message : String(err))))
          [fnName](...args);
      });
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg, type = 'info') {
      const root = document.getElementById('toast-root');
      const el = document.createElement('div');
      const cls =
        type === 'error' ? 'bg-red-700 text-white' :
        type === 'success' ? 'bg-emerald-700 text-white' :
        'bg-[#0F2547] text-white border border-[#C9A227]/40';
      el.className = `px-4 py-3 rounded-xl shadow-lg text-xs font-medium flex items-center gap-2 ${cls}`;
      el.innerHTML = `<span>${esc(msg)}</span>`;
      root.appendChild(el);
      setTimeout(() => { el.remove(); }, 3500);
    }

    function effectiveRole() {
      if (!state.user) return 'SISWA';
      if (state.user.role === 'SUPER_ADMIN' && state.previewRole) return state.previewRole;
      return state.user.role;
    }

    function isStaff() {
      return effectiveRole() !== 'SISWA';
    }

    function getNavMenus() {
      const role = effectiveRole();
      if (role === 'SISWA') {
        return [
          { id: 'dashboard', label: 'Beranda', icon: 'home', tabs: [] },
          { id: 'identitas', label: 'Rundown Kegiatan', icon: 'calendar-clock', tabs: [] },
          { id: 'dokumentasi', label: 'Dokumentasi', icon: 'images', tabs: [] },
          { id: 'lkpd', label: 'LKPD & Refleksi', icon: 'book-open-check', tabs: ['Instrumen LKPD', 'Refleksi Siswa'] }
        ];
      }
      const menus = [
        { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard', tabs: [] },
        { id: 'identitas', label: 'Identitas & Agenda', icon: 'clipboard-list', tabs: ['Identitas Kegiatan', 'Agenda & Rundown'] },
        { id: 'peserta', label: 'Peserta & Guru', icon: 'users', tabs: ['Data Peserta', 'Guru Pendamping'] },
        { id: 'jurnal', label: 'Jurnal & Evaluasi', icon: 'notebook-pen', tabs: ['Jurnal Pelaksanaan', 'Evaluasi Kegiatan'] },
        { id: 'dokumentasi', label: 'Dokumentasi', icon: 'images', tabs: [] },
        { id: 'lkpd', label: 'LKPD & Refleksi', icon: 'book-open-check', tabs: ['Instrumen LKPD', 'Refleksi Siswa'] },
        { id: 'laporan', label: 'Laporan & Arsip', icon: 'file-text', tabs: ['Laporan Otomatis', 'Arsip Digital'] }
      ];
      if (role === 'SUPER_ADMIN') {
        menus.push({ id: 'pengaturan', label: 'Pengaturan', icon: 'settings', tabs: ['Akun & Hak Akses', 'Identitas Sekolah', 'Backup & Audit'] });
      }
      return menus;
    }

    function selectMenu(id, tabName = '') {
      state.activeMenu = id;
      const menu = getNavMenus().find(m => m.id === id);
      state.subTab = tabName || (menu && menu.tabs.length ? menu.tabs[0] : '');
      state.mobileDrawer = false;
      render();
    }

    async function initApp() {
      if (state.token) {
        try {
          const res = await gasCall('verifySession', state.token);
          if (res && res.ok) {
            state.user = res.user;
            const boot = await gasCall('getBootstrapData', state.token);
            state.data = boot;
          } else {
            localStorage.removeItem(TOKEN_KEY);
            state.token = '';
          }
        } catch (err) {
          localStorage.removeItem(TOKEN_KEY);
          state.token = '';
        }
      }
      state.loading = false;
      render();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('login-id').value.trim();
      const password = document.getElementById('login-pass').value;
      if (!identifier || !password) return;
      state.authError = '';
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Memverifikasi...';
      try {
        const res = await gasCall('loginUser', identifier, password);
        if (!res.ok) {
          state.authError = res.error || 'Username atau kata sandi salah.';
          render();
          return;
        }
        state.token = res.token;
        state.user = res.user;
        localStorage.setItem(TOKEN_KEY, res.token);
        state.loading = true;
        render();
        state.data = await gasCall('getBootstrapData', state.token);
        state.activeMenu = 'dashboard';
        state.subTab = '';
      } catch (err) {
        state.authError = err.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    function handleLogout() {
      localStorage.removeItem(TOKEN_KEY);
      state.token = '';
      state.user = null;
      state.data = null;
      state.previewRole = null;
      state.authError = '';
      render();
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function openModal(title, bodyHtml, maxWidth = 'max-w-xl') {
      const root = document.getElementById('modal-root');
      root.innerHTML = `
        <div class="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4 overflow-y-auto">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full ${maxWidth} overflow-hidden my-auto">
            <div class="px-5 py-4 bg-[#0F2547] text-white flex items-center justify-between">
              <h3 class="text-sm font-semibold">${esc(title)}</h3>
              <button type="button" onclick="closeModal()" class="text-slate-300 hover:text-white p-1">
                <i data-lucide="x" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="p-5 max-h-[82vh] overflow-y-auto">${bodyHtml}</div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function confirmAction(title, message, onConfirm) {
      openModal(title, `
        <p class="text-sm text-slate-600 mb-5">${esc(message)}</p>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-semibold border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50">Batal</button>
          <button type="button" id="confirm-yes-btn" class="px-4 py-2 text-xs font-semibold bg-red-600 hover:bg-red-700 text-white rounded-lg">Ya, Lanjutkan</button>
        </div>
      `, 'max-w-md');
      document.getElementById('confirm-yes-btn').onclick = async () => {
        closeModal();
        await onConfirm();
      };
    }

    async function runMutation(fnCall, successMsg) {
      try {
        const res = await fnCall();
        if (res && res.ok) state.data = res;
        if (successMsg) showToast(successMsg, 'success');
        render();
      } catch (err) {
        showToast(err.message || 'Terjadi kesalahan saat menyimpan data.', 'error');
      }
    }

    /* =====================================================================
     * RENDER LOGIN
     * ===================================================================== */
    function renderLogin() {
      return `
        <div class="min-h-screen bg-slate-50 flex flex-col lg:flex-row">
          <div class="lg:w-7/12 relative bg-[#081429] text-white flex flex-col justify-between p-8 lg:p-12 overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-br from-[#081429] via-[#0F2547] to-[#173463]"></div>
            <div class="relative z-10 flex items-center gap-3.5">
              <div class="w-11 h-11 rounded-xl bg-[#C9A227]/20 border border-[#E0BD4F]/40 flex items-center justify-center">
                <i data-lucide="graduation-cap" class="w-6 h-6 text-[#E0BD4F]"></i>
              </div>
              <div>
                <p class="text-xs font-medium tracking-wide text-[#E0BD4F]">SMA DARUL ULUM KEPOHBARU · BOJONEGORO</p>
                <h1 class="text-lg font-semibold text-white">Sistem Informasi Pelaporan Kegiatan Kokurikuler</h1>
              </div>
            </div>
            <div class="relative z-10 max-w-2xl my-12">
              <p class="text-xs font-medium text-[#E0BD4F] mb-3">Tahun Pelaksanaan 2026 · Google Apps Script Web App</p>
              <h2 class="text-2xl lg:text-4xl font-semibold text-white leading-tight mb-4">
                Kunjungan Edukatif ke Makam dan Museum Ir. Soekarno, Presiden Pertama Republik Indonesia
              </h2>
              <p class="text-sm text-slate-200 leading-relaxed mb-8">
                Platform terpadu administrasi peserta, jurnal pendampingan, dokumentasi Google Drive, instrumen LKPD siswa, serta penyusunan laporan otomatis berbasis Google Sheets.
              </p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 border-t border-white/15 pt-6 text-xs">
                <div><p class="font-semibold text-white">Database Google Sheets</p><p class="text-slate-300 mt-0.5">Tersinkronisasi otomatis</p></div>
                <div><p class="font-semibold text-white">LKPD & Refleksi</p><p class="text-slate-300 mt-0.5">6 mapel & penilaian guru</p></div>
                <div><p class="font-semibold text-white">Laporan Otomatis</p><p class="text-slate-300 mt-0.5">Ekspor PDF & Word</p></div>
              </div>
            </div>
          </div>

          <div class="lg:w-5/12 flex items-center justify-center p-6 sm:p-10 bg-white">
            <div class="w-full max-w-md">
              <div class="inline-flex items-center gap-2 text-xs font-semibold text-[#0F2547] mb-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-[#C9A227]"></i>
                <span>Portal Masuk Pengguna</span>
              </div>
              <h2 class="text-2xl font-semibold text-slate-900 mb-1.5">Masuk ke Dasbor</h2>
              <p class="text-sm text-slate-600 mb-6">Masukkan username / email dan kata sandi akun Anda.</p>

              ${state.authError ? `<div class="mb-5 p-3.5 bg-red-50 border border-red-200 rounded-xl text-xs text-red-800">${esc(state.authError)}</div>` : ''}

              <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Username atau Email</label>
                  <input id="login-id" type="text" required placeholder="Admin" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:border-[#0F2547]" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Kata Sandi</label>
                  <input id="login-pass" type="password" required placeholder="Masukkan kata sandi" class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-xl focus:outline-none focus:border-[#0F2547]" />
                </div>
                <button id="login-btn" type="submit" class="w-full py-3 bg-[#0F2547] hover:bg-[#173463] text-white text-sm font-semibold rounded-xl transition-colors cursor-pointer">
                  Masuk ke Dasbor
                </button>
              </form>
              <p class="mt-6 text-xs text-slate-500 text-center">Hak akses disesuaikan untuk Super Admin, Kepala Sekolah, Ketua Pelaksana, Guru Pendamping, dan Siswa.</p>
            </div>
          </div>
        </div>
      `;
    }

    /* =====================================================================
     * RENDER DASHBOARD & BERANDA
     * ===================================================================== */
    function renderDashboard() {
      const d = state.data;
      const act = d.activity || {};
      const checks = [
        { label: 'Identitas Kegiatan', done: !!act.name, menu: 'identitas', tab: 'Identitas Kegiatan' },
        { label: 'Data Peserta Didik', done: d.students.length > 0, menu: 'peserta', tab: 'Data Peserta' },
        { label: 'Guru Pendamping', done: d.teachers.length > 0, menu: 'peserta', tab: 'Guru Pendamping' },
        { label: 'Rundown Kegiatan', done: d.schedules.length > 0, menu: 'identitas', tab: 'Agenda & Rundown' },
        { label: 'Jurnal Pelaksanaan', done: d.journals.length > 0, menu: 'jurnal', tab: 'Jurnal Pelaksanaan' },
        { label: 'Dokumentasi Foto/Video', done: d.documentation.length > 0, menu: 'dokumentasi', tab: '' },
        { label: 'Evaluasi & Laporan', done: d.evaluations.length > 0 && d.reports.length > 0, menu: 'laporan', tab: 'Laporan Otomatis' }
      ];
      const pct = Math.round((checks.filter(c => c.done).length / checks.length) * 100);

      if (!isStaff()) {
        return `
          <div class="space-y-6">
            <div class="bg-[#0F2547] text-white rounded-2xl p-6 lg:p-8 border border-[#1E4480]">
              <p class="text-xs font-semibold text-[#E0BD4F] uppercase tracking-wider">Portal Siswa · Tahun 2026</p>
              <h1 class="text-2xl font-semibold mt-1">${esc(act.name || 'Kegiatan Kokurikuler SMA Darul Ulum')}</h1>
              <p class="text-sm text-slate-200 mt-2">${esc(act.theme || '')}</p>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6 pt-5 border-t border-white/15 text-xs">
                <div><span class="text-slate-300">Jadwal:</span> <strong class="block text-white mt-0.5">${esc(act.dayDate)}</strong></div>
                <div><span class="text-slate-300">Keberangkatan:</span> <strong class="block text-white mt-0.5">${esc(act.departureTime)}</strong></div>
                <div><span class="text-slate-300">Lokasi Tujuan:</span> <strong class="block text-white mt-0.5">${esc(act.destination)}</strong></div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="bg-white border border-slate-200 rounded-xl p-5">
                <p class="text-xs text-slate-500 font-medium">LKPD Terkirim</p>
                <p class="text-2xl font-bold text-[#0F2547] mt-1">${d.lkpdSubmissions.length}</p>
                <button onclick="selectMenu('lkpd', 'Instrumen LKPD')" class="mt-3 text-xs font-semibold text-[#0F2547] hover:underline">Buka Instrumen LKPD →</button>
              </div>
              <div class="bg-white border border-slate-200 rounded-xl p-5">
                <p class="text-xs text-slate-500 font-medium">Refleksi Belajar</p>
                <p class="text-2xl font-bold text-[#0F2547] mt-1">${d.reflections.length}</p>
                <button onclick="selectMenu('lkpd', 'Refleksi Siswa')" class="mt-3 text-xs font-semibold text-[#0F2547] hover:underline">Isi Refleksi →</button>
              </div>
              <div class="bg-white border border-slate-200 rounded-xl p-5">
                <p class="text-xs text-slate-500 font-medium">Agenda Rundown</p>
                <p class="text-2xl font-bold text-[#0F2547] mt-1">${d.schedules.length} Sesi</p>
                <button onclick="selectMenu('identitas')" class="mt-3 text-xs font-semibold text-[#0F2547] hover:underline">Lihat Jadwal →</button>
              </div>
              <div class="bg-white border border-slate-200 rounded-xl p-5">
                <p class="text-xs text-slate-500 font-medium">Galeri Dokumentasi</p>
                <p class="text-2xl font-bold text-[#0F2547] mt-1">${d.documentation.length} Media</p>
                <button onclick="selectMenu('dokumentasi')" class="mt-3 text-xs font-semibold text-[#0F2547] hover:underline">Lihat Galeri →</button>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-6">
          <div class="bg-white border border-slate-200 rounded-2xl p-6 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
            <div>
              <div class="inline-flex items-center gap-2 text-xs font-semibold text-[#0F2547] bg-amber-50 border border-amber-200 px-2.5 py-1 rounded-md mb-2">
                <span>Tahun Pelaksanaan ${esc(act.year || 2026)}</span>
                <span>·</span>
                <span>Status: ${esc(act.status || 'Berjalan')}</span>
              </div>
              <h1 class="text-xl font-bold text-[#0F2547]">${esc(act.name)}</h1>
              <p class="text-sm text-slate-600 mt-1">${esc(act.theme)}</p>
              <p class="text-xs text-slate-500 mt-2">Lokasi: ${esc(act.destination)} · ${esc(act.dayDate)}</p>
            </div>
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 min-w-[220px]">
              <div class="flex justify-between text-xs font-semibold text-slate-700 mb-1.5">
                <span>Kelengkapan Laporan</span>
                <span class="text-[#0F2547]">${pct}%</span>
              </div>
              <div class="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
                <div class="h-full bg-[#C9A227] rounded-full" style="width:${pct}%"></div>
              </div>
              <p class="text-[11px] text-slate-500 mt-2">${checks.filter(c=>c.done).length} dari ${checks.length} pilar data terpenuhi</p>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white border border-slate-200 rounded-xl p-5">
              <p class="text-xs font-medium text-slate-500">Peserta Didik</p>
              <p class="text-2xl font-bold text-[#0F2547] mt-1">${d.students.length}</p>
              <p class="text-xs text-slate-500 mt-1">Hadir: ${d.students.filter(s=>s.participationStatus==='Hadir').length} siswa</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-5">
              <p class="text-xs font-medium text-slate-500">Guru Pendamping</p>
              <p class="text-2xl font-bold text-[#0F2547] mt-1">${d.teachers.length}</p>
              <p class="text-xs text-slate-500 mt-1">Penanggung jawab lapangan</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-5">
              <p class="text-xs font-medium text-slate-500">Dokumentasi & LKPD</p>
              <p class="text-2xl font-bold text-[#0F2547] mt-1">${d.documentation.length} / ${d.lkpdSubmissions.length}</p>
              <p class="text-xs text-slate-500 mt-1">Media galeri & lembar LKPD</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-xl p-5">

    function initChartIfPresent() {
      const canvas = document.getElementById('engagement-chart');
      if (!canvas || !state.data) return;
      if (state.chartInstance) {
        state.chartInstance.destroy();
        state.chartInstance = null;
      }
      const counts = {};
      (state.data.students || []).forEach(s => { const k = s.className || 'Lainnya'; counts[k] = counts[k] || { peserta: 0, kiriman: 0 }; counts[k].peserta++; });
      (state.data.reflections || []).forEach(r => { const k = r.className || 'Lainnya'; counts[k] = counts[k] || { peserta: 0, kiriman: 0 }; counts[k].kiriman++; });
      (state.data.lkpdSubmissions || []).forEach(l => { const k = l.className || 'Lainnya'; counts[k] = counts[k] || { peserta: 0, kiriman: 0 }; counts[k].kiriman++; });
      const labels = Object.keys(counts);
      state.chartInstance = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: labels.length ? labels : ['Belum ada kelas'],
          datasets: [
            { label: 'Peserta Terdaftar', data: labels.map(k => counts[k].peserta), backgroundColor: '#0F2547', borderRadius: 6 },
            { label: 'LKPD & Refleksi Terkirim', data: labels.map(k => counts[k].kiriman), backgroundColor: '#C9A227', borderRadius: 6 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
      });
    }

        rows.push([s.nis, s.name, s.className, s.gender, s.parentPhone || '', s.busGroup || '', s.participationStatus]);
      });
      const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');

    async function submitDocForm(e) {
      e.preventDefault();
      const btn = document.getElementById('doc-save-btn');
      btn.disabled = true; btn.textContent = 'Mengunggah...';
      try {
        const fd = new FormData(e.target);
        const fileInput = document.getElementById('doc-file-input');
        let fileUrl = String(fd.get('fileUrl') || '').trim();
        let fileName = '';
        if (fileInput.files && fileInput.files[0]) {
          const file = fileInput.files[0];
          const b64 = await readFileBase64(file);
          const up = await gasCall('uploadFileToDrive', state.token, file.name, file.type, b64);
          fileUrl = up.fileUrl;
          fileName = up.fileName;
        }
        if (!fileUrl) throw new Error('Pilih file untuk diunggah atau masukkan URL media.');
        closeModal();
        await runMutation(() => gasCall('upsertRecord', state.token, 'Documentation', {
          title: fd.get('title'),
          category: fd.get('category'),
          mediaType: fd.get('mediaType'),
          capturedDate: fd.get('capturedDate'),
          location: fd.get('location'),
          caption: fd.get('caption'),
          fileUrl: fileUrl,
          fileName: fileName,
          isAllowedForStudent: !!fd.get('isAllowedForStudent')
        }), 'Dokumentasi berhasil disimpan.');
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Unggah & Simpan';
      }
    }

    function readFileBase64(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => resolve(String(r.result || ''));
        r.onerror = () => reject(new Error('Gagal membaca berkas.'));
        r.readAsDataURL(file);
      });
    }

    function openGradeModal(sheetName, id) {
      const list = sheetName === 'LkpdSubmissions' ? state.data.lkpdSubmissions : state.data.reflections;
      const item = (list || []).find(x => x.id === id) || {};
      const label = item.groupName ? `${item.groupName} (${item.studentName || ''})` : (item.studentName || 'Siswa');
      const curScore = item.teacherScore !== '' && item.teacherScore != null ? item.teacherScore : 90;
      const curFeedback = item.teacherFeedback || '';
      openModal(`Penilaian Guru - ${label}`, `
        <form onsubmit="submitGradeForm(event, '${esc(sheetName)}', '${esc(id)}')" class="space-y-3 text-sm">

          </div>
        </form>
      `, 'max-w-md');
    }

    async function submitGradeForm(e, sheetName, id) {
      e.preventDefault();
      const fd = new FormData(e.target);
      closeModal();
      await runMutation(() => gasCall('gradeStudentItem', state.token, sheetName, id, Number(fd.get('score')), String(fd.get('feedback') || '')), 'Nilai siswa berhasil disimpan.');
    }

    async function submitArchiveForm(e) {
      e.preventDefault();
      const btn = document.getElementById('arc-save-btn');
      btn.disabled = true; btn.textContent = 'Mengunggah...';
      try {
        const fd = new FormData(e.target);
        const fileInput = document.getElementById('arc-file-input');
        let fileUrl = String(fd.get('fileUrl') || '').trim();
        let fileName = '';
        if (fileInput.files && fileInput.files[0]) {
          const file = fileInput.files[0];
          const b64 = await readFileBase64(file);
          const up = await gasCall('uploadFileToDrive', state.token, file.name, file.type, b64);
          fileUrl = up.fileUrl; fileName = up.fileName;
        }
        if (!fileUrl) throw new Error('Pilih berkas atau masukkan tautan URL.');
        closeModal();
        await runMutation(() => gasCall('upsertRecord', state.token, 'Archives', {
          category: fd.get('category'),
          title: fd.get('title'),
          documentNumber: fd.get('documentNumber'),
          documentDate: fd.get('documentDate'),
          description: fd.get('description'),
          fileUrl: fileUrl,
          fileName: fileName
        }), 'Arsip digital berhasil disimpan.');
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false; btn.textContent = 'Simpan Arsip';
      }
    }

              <nav class="flex-1 p-3 space-y-1">
                ${menus.map(m => `
                  <button onclick="selectMenu('${m.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-left ${state.activeMenu===m.id ? 'bg-[#0F2547] text-white' : 'text-slate-700 hover:bg-slate-100'}">
                    <i data-lucide="${m.icon}" class="w-4 h-4 ${state.activeMenu===m.id ? 'text-[#E0BD4F]' : 'text-slate-500'}"></i>
                    <span class="truncate">${esc(m.label)}</span>
                  </button>
                `).join('')}
              </nav>
            </aside>

            ${state.mobileDrawer ? `
              <div class="no-print fixed inset-0 z-50 lg:hidden flex">
                <div class="fixed inset-0 bg-slate-950/50" onclick="state.mobileDrawer=false; render();"></div>
                <aside class="relative w-72 bg-white h-full z-10 flex flex-col p-3 space-y-1">
                  <div class="flex items-center justify-between px-2 py-3 border-b border-slate-100 mb-2">
                    <span class="font-bold text-sm text-[#0F2547]">${esc(schoolName)}</span>
                    <button onclick="state.mobileDrawer=false; render();" class="p-1 text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
                  </div>
                  ${menus.map(m => `
                    <button onclick="selectMenu('${m.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 text-sm font-medium rounded-lg text-left ${state.activeMenu===m.id ? 'bg-[#0F2547] text-white' : 'text-slate-700 hover:bg-slate-100'}">
                      <i data-lucide="${m.icon}" class="w-4 h-4"></i>
                      <span>${esc(m.label)}</span>
                    </button>
                  `).join('')}
                </aside>
              </div>` : ''}

            <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">
              ${curMenu && curMenu.tabs.length ? `
                <div class="no-print bg-white border border-slate-200 rounded-xl p-1.5 inline-flex flex-wrap gap-1 mb-5">
                  ${curMenu.tabs.map(t => `
                    <button onclick="state.subTab='${t}'; render();" class="px-4 py-2 text-xs font-semibold rounded-lg ${state.subTab===t ? 'bg-[#0F2547] text-white' : 'text-slate-600 hover:bg-slate-100'}">${esc(t)}</button>
                  `).join('')}
                </div>` : ''}
              ${renderModuleBody()}
            </main>
          </div>
        </div>
      `;

      lucide.createIcons();
      initChartIfPresent();
    }

    initApp();
  </script>
</body>
</html>
